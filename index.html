<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applica il tema salvato prima del render di React (evita il flash).
      // La chiave deve combaciare con THEME_STORAGE_KEY in src/contexts/theme.
      try {
        var t = localStorage.getItem("beyx-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>beyx-web-app</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
